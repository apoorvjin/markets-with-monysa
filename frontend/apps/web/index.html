<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinBrio — Markets</title>
    <meta
      name="description"
      content="Live global markets, AI trading signals, and macro dashboards — indices, forex, commodities, and tariff exposure in one screen."
    />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="FinBrio — Markets" />
    <meta
      property="og:description"
      content="Live global markets, AI trading signals, and macro dashboards — indices, forex, commodities, and tariff exposure in one screen."
    />
    <meta property="og:image" content="/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FinBrio — Markets" />
    <meta
      name="twitter:description"
      content="Live global markets, AI trading signals, and macro dashboards — indices, forex, commodities, and tariff exposure in one screen."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <meta name="theme-color" content="#000000" />
    <script>
      // Apply persisted theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("monysa-theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
